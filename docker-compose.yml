# NVDA shares dashboard - two services (Flask API + static Angular server).
#
#   docker compose up -d --build       # build + run in background
#   docker compose logs -f             # tail logs
#   docker compose down                # stop
#
# The SQLite DB and config live on the host (./configs) via a bind mount, so data
# persists across container rebuilds and the recorder keeps appending to the same DB.
# Secrets are optional: helpers/config.py falls back to built-in defaults. Set overrides
# in a .env file next to this compose file (e.g. FINNHUB_TOKEN=..., BREEZE_API_KEY=...).

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: shares-backend
    container_name: shares-backend
    restart: unless-stopped
    # Host uses systemd-resolved (127.0.0.53) but exposes no upstream file Docker can
    # read, leaving the container's embedded resolver with no external DNS. Pin public
    # resolvers so outbound API calls (Frankfurter, Finnhub, AMFI, ICICI) resolve.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "8080:8080"
    volumes:
      - ./configs:/app/configs
    # Secrets/keys (Finnhub, FMV, ICICI Breeze, ...) come from dashboard/.env.
    # Optional: helpers/config.py falls back to baked defaults if absent.
    env_file:
      - path: ./dashboard/.env
        required: false
    environment:
      PORT: "8080"

  frontend:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: shares-dashboard
    container_name: shares-dashboard
    restart: unless-stopped
    ports:
      - "4201:4201"
    volumes:
      - ./certs:/app/certs:ro
    environment:
      PORT: "4201"
      API_TARGET: "http://backend:8080"
      # HTTPS: present these to serve TLS (self-signed). Remove to fall back to HTTP.
      TLS_CERT_FILE: "/app/certs/cert.pem"
      TLS_KEY_FILE: "/app/certs/key.pem"
    depends_on:
      backend:
        condition: service_healthy
